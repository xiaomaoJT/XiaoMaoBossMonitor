<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" font-family="-apple-system, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', sans-serif">
  <defs>
    <linearGradient id="gOpen" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#065f46"/><stop offset="1" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="gPillG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#059669"/><stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <pattern id="hatch" width="14" height="14" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="14" height="14" fill="#fff1f2"/>
      <line x1="0" y1="0" x2="0" y2="14" stroke="#fecdd3" stroke-width="3" opacity="0.45"/>
    </pattern>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#fb7185"/>
    </marker>
  </defs>

  <rect width="1200" height="780" fill="#f6f8fc"/>
  <text x="48" y="50" font-size="23" font-weight="800" fill="#0f172a">BossMonitor 架构与仓库边界</text>
  <rect x="952" y="26" width="200" height="32" rx="16" fill="url(#gPillG)"/>
  <text x="1052" y="47" font-size="12.5" font-weight="700" fill="#ffffff" text-anchor="middle">v1.9.18 · Apache-2.0</text>
  <text x="48" y="76" font-size="12.5" fill="#64748b">绿色实线框 = 本仓库已开源 · 红色虚线框 = 独立组件，不在本仓库、也不在任何历史提交里</text>

  <!-- ═══ 摄像头 ═══ -->
  <rect x="48" y="150" width="204" height="150" rx="14" fill="#ffffff" stroke="#d9e2ee"/>
  <path d="M48 164 a14 14 0 0 1 14 -14 h176 a14 14 0 0 1 14 14 v22 h-204 z" fill="#f1f5f9"/>
  <text x="64" y="178" font-size="13.5" font-weight="700" fill="#0f172a">摄像头信号源</text>
  <text x="64" y="214" font-size="11" fill="#334155">ws-flv · H.264 / H.265</text>
  <text x="64" y="236" font-size="11" fill="#334155">RTSP · N 路每路一流</text>
  <text x="64" y="258" font-size="10.5" fill="#94a3b8">流地址自备</text>

  <!-- ═══ 本仓库开源客户端（hero 绿） ═══ -->
  <rect x="300" y="104" width="424" height="420" rx="14" fill="#ffffff" stroke="#6ee7b7" stroke-width="1.8"/>
  <path d="M300 118 a14 14 0 0 1 14 -14 h396 a14 14 0 0 1 14 14 v32 h-424 z" fill="url(#gOpen)"/>
  <text x="318" y="140" font-size="15" font-weight="800" fill="#ffffff">开源客户端 · 本仓库（浏览器内）</text>
  <text x="706" y="140" font-size="10.5" fill="#d1fae5" text-anchor="end">clone 即得 ✓</text>

  <g font-size="11.3" fill="#334155">
    <text x="322" y="188">✓ <tspan font-weight="700" fill="#0f172a">多路播放</tspan>：ws-flv / HLS 秒开 · 帧步进 · 性能面板</text>
    <text x="322" y="220">✓ <tspan font-weight="700" fill="#0f172a">页面内检测</tspan>：onnxruntime-web 人形 / 人脸 / 姿态</text>
    <text x="322" y="252">✓ <tspan font-weight="700" fill="#0f172a">区域画框 · 静默</tspan> · 隐私遮罩 · 水印 · 盲视</text>
    <text x="322" y="284">✓ <tspan font-weight="700" fill="#0f172a">事件中心</tspan>：今日 / 历史 / 未读 + 类型筛选</text>
    <text x="322" y="316">✓ <tspan font-weight="700" fill="#0f172a">统计面板</tspan>：KPI / 趋势 / 环形 / 分布 / 推送成功率</text>
    <text x="322" y="348">✓ <tspan font-weight="700" fill="#0f172a">三渠道推送</tspan>：钉钉 / 企微 / TG，前端直发</text>
    <text x="322" y="380">✓ <tspan font-weight="700" fill="#0f172a">登录门禁</tspan> · 配置导入导出 · 深浅主题 · 大屏</text>
  </g>

  <rect x="318" y="404" width="388" height="96" rx="9" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="332" y="428" font-size="11.5" font-weight="700" fill="#047857">这一整块独立可跑</text>
  <text x="332" y="450" font-size="10.5" fill="#475569">看画面、改配置、跑页面内检测（自备模型）、发推送</text>
  <text x="332" y="470" font-size="10.5" fill="#475569">关掉页面即停止 · 不做服务端落盘</text>
  <text x="318" y="518" font-size="10.5" fill="#94a3b8">0 依赖自绘 SVG · 同一份 dist 六端复用 · 纯函数判定与完整版同源</text>

  <!-- ═══ 未开源独立组件（红虚线 + 斜纹） ═══ -->
  <rect x="772" y="104" width="380" height="420" rx="14" fill="url(#hatch)" stroke="#fb7185" stroke-width="1.6" stroke-dasharray="8 5"/>
  <path d="M772 118 a14 14 0 0 1 14 -14 h352 a14 14 0 0 1 14 14 v32 h-380 z" fill="#fee2e2"/>
  <text x="790" y="140" font-size="15" font-weight="800" fill="#b91c1c">独立组件 · 未开源（完整版才有）</text>

  <g font-size="11.2" fill="#7f1d1d">
    <text x="792" y="188">✗ <tspan font-weight="700" fill="#4c0519">7×24 常驻引擎</tspan>：ffmpeg → 推理 → SQLite 落库</text>
    <text x="792" y="216">✗ <tspan font-weight="700" fill="#4c0519">桌面托盘外壳</tspan> + 七页控制台 + 口令闸门</text>
    <text x="792" y="244">✗ <tspan font-weight="700" fill="#4c0519">观察模式</tspan>：观察机接入 / 提权 / 观察历史</text>
    <text x="792" y="272">✗ <tspan font-weight="700" fill="#4c0519">自愈与值守</tspan>：自愈重启 · 哨兵 · 硬重启 · TG 遥控</text>
    <text x="792" y="300">✗ <tspan font-weight="700" fill="#4c0519">命中修正 / 陌生人反例库</tspan> · 值守查岗</text>
    <text x="792" y="328">✗ <tspan font-weight="700" fill="#4c0519">后端模式</tspan>：配置双向同步 / 事件增量</text>
    <text x="792" y="356">✗ <tspan font-weight="700" fill="#4c0519">关键事件独立机器人</tspan> / 托管大屏给他人</text>
  </g>

  <rect x="790" y="380" width="344" height="88" rx="9" fill="#ffffff" stroke="#fecaca"/>
  <text x="804" y="404" font-size="11.5" font-weight="700" fill="#b91c1c">缺它最直观的两件事</text>
  <text x="804" y="426" font-size="10.5" fill="#78716c">关掉页面就停；手机不能遥控电脑端</text>
  <text x="804" y="446" font-size="10.5" fill="#78716c">多台设备各一份配置，互不相通</text>
  <text x="792" y="492" font-size="10.5" fill="#a1a1aa">以上逐条对应「clone 本仓库体验不到」的能力</text>

  <!-- ═══ 推送渠道 ═══ -->
  <rect x="48" y="360" width="204" height="164" rx="14" fill="#ffffff" stroke="#d9e2ee"/>
  <path d="M48 374 a14 14 0 0 1 14 -14 h176 a14 14 0 0 1 14 14 v22 h-204 z" fill="#ccfbf1"/>
  <text x="64" y="394" font-size="13.5" font-weight="700" fill="#115e59">推送渠道 → 手机</text>
  <text x="64" y="430" font-size="11" fill="#334155">钉钉（加签）· 企业微信</text>
  <text x="64" y="452" font-size="11" fill="#334155">Telegram Bot</text>
  <text x="64" y="478" font-size="10.5" fill="#94a3b8">本仓库由前端直发</text>
  <text x="64" y="498" font-size="10.5" fill="#94a3b8">完整版引擎也可直推</text>

  <!-- 连线 -->
  <line x1="252" y1="225" x2="294" y2="225" stroke="#64748b" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="256" y="214" font-size="10.5" fill="#64748b">拉流</text>

  <path d="M380 524 V544 H150 V530" fill="none" stroke="#0d9488" stroke-width="1.5" marker-end="url(#ar)"/>
  <text x="200" y="538" font-size="10.5" fill="#0d9488">前端直发（本仓库已有）</text>

  <line x1="724" y1="210" x2="766" y2="210" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="726" y="198" font-size="10" fill="#b91c1c">HTTP 同步</text>
  <line x1="766" y1="252" x2="728" y2="252" stroke="#fb7185" stroke-width="1.4" stroke-dasharray="6 4" marker-end="url(#arr)"/>
  <text x="726" y="274" font-size="10" fill="#b91c1c">事件增量</text>

  <!-- ═══ 想体验怎么办 ═══ -->
  <rect x="300" y="576" width="852" height="124" rx="14" fill="#ffffff" stroke="#d9e2ee"/>
  <text x="320" y="606" font-size="13.5" font-weight="800" fill="#0f172a">想体验未开源能力？</text>
  <text x="320" y="636" font-size="11" fill="#334155">① 自备 7 个 ONNX 模型</text>
  <text x="320" y="658" font-size="10.2" fill="#94a3b8">→ 页面内检测可出告警（关页仍停）</text>
  <text x="620" y="636" font-size="11" fill="#334155">② 自行实现常驻引擎</text>
  <text x="620" y="658" font-size="10.2" fill="#94a3b8">→ 按 /api 契约对接后端模式</text>
  <text x="920" y="636" font-size="11" fill="#334155">③ 托盘 / 观察 / 自愈 / TG 遥控</text>
  <text x="920" y="658" font-size="10.2" fill="#94a3b8">→ 属完整版，本仓库不会提供</text>

  <!-- 边界一句话 -->
  <rect x="48" y="576" width="204" height="124" rx="14" fill="#f8fafc" stroke="#d9e2ee"/>
  <text x="64" y="604" font-size="11.5" font-weight="700" fill="#0f172a">本仓库单独部署即可</text>
  <text x="64" y="628" font-size="10.2" fill="#64748b">看画面、改配置、页面内</text>
  <text x="64" y="646" font-size="10.2" fill="#64748b">检测（自备模型）、发推送；</text>
  <text x="64" y="664" font-size="10.2" fill="#64748b">与独立引擎间可选 HTTP 同步</text>

  <!-- 页脚 -->
  <text x="48" y="732" font-size="11" fill="#b91c1c">需要「关掉页面还在盯」时才用得上右侧虚线部分 —— 没有它，本仓库照样能跑。</text>
  <text x="48" y="756" font-size="10.5" fill="#94a3b8">※ 结构示意图，非真实截图；前端与引擎都就位时，能力开关 / 流向匹配 / 静默判定共用同一批纯函数源码。</text>
</svg>
