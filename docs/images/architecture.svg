<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="system-ui, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="600" fill="#f8fafc"/>
  <text x="40" y="42" font-size="20" font-weight="700" fill="#0f172a">BossMonitor 整体架构</text>
  <text x="40" y="64" font-size="12" fill="#94a3b8">示意图 · 非真实截图（仅表达组件关系）</text>

  <!-- 摄像头 -->
  <rect x="40" y="110" width="200" height="92" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="138" font-size="14" font-weight="600" fill="#0f172a">摄像头信号源</text>
  <text x="56" y="160" font-size="12" fill="#64748b">ws-flv / RTSP</text>
  <text x="56" y="180" font-size="12" fill="#64748b">N 路 · 每路一路流</text>

  <!-- 展示端 -->
  <rect x="40" y="262" width="200" height="206" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="56" y="290" font-size="14" font-weight="600" fill="#0f172a">展示端 × 6</text>
  <text x="56" y="312" font-size="12" fill="#64748b">同一份前端（Vue 3）</text>
  <text x="56" y="340" font-size="12" fill="#334155">浏览器</text>
  <text x="120" y="340" font-size="12" fill="#334155">macOS</text>
  <text x="56" y="362" font-size="12" fill="#334155">Windows</text>
  <text x="130" y="362" font-size="12" fill="#334155">iOS</text>
  <text x="56" y="384" font-size="12" fill="#334155">Apple Watch</text>
  <text x="56" y="406" font-size="12" fill="#334155">微信小程序</text>
  <text x="56" y="438" font-size="11" fill="#94a3b8">大屏 / 事件 / 设置抽屉</text>

  <!-- 后端 -->
  <rect x="330" y="90" width="360" height="440" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
  <text x="350" y="120" font-size="15" font-weight="700" fill="#0f172a">常驻后端 · server/（Node）</text>
  <text x="350" y="140" font-size="11" fill="#94a3b8">headless-monitor.mjs</text>

  <rect x="350" y="156" width="320" height="56" rx="8" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="366" y="180" font-size="12.5" font-weight="600" fill="#1d4ed8">拉流 · 解码</text>
  <text x="366" y="199" font-size="11.5" fill="#3b4a63">ffmpeg → JPEG 帧</text>

  <rect x="350" y="222" width="320" height="112" rx="8" fill="#ecfdf5" stroke="#a7f3d0"/>
  <text x="366" y="246" font-size="12.5" font-weight="600" fill="#047857">AI 检测引擎 · onnxruntime-node</text>
  <text x="366" y="268" font-size="11.5" fill="#3b4a63">人形 · 人脸（SCRFD + MobileFaceNet）</text>
  <text x="366" y="288" font-size="11.5" fill="#3b4a63">姿态 · 区域进出 · 人员流向</text>
  <text x="366" y="312" font-size="11" fill="#64748b">检测 100% 在后端跑（前端零本地 AI）</text>

  <rect x="350" y="344" width="320" height="70" rx="8" fill="#fffbeb" stroke="#fde68a"/>
  <text x="366" y="368" font-size="12.5" font-weight="600" fill="#b45309">推送调度</text>
  <text x="366" y="388" font-size="11.5" fill="#3b4a63">三渠道 · 限流 · 合并 · 静默 · 模板</text>
  <text x="366" y="406" font-size="11" fill="#64748b">钉钉 / 企微 / Telegram</text>

  <rect x="350" y="424" width="320" height="86" rx="8" fill="#f5f3ff" stroke="#ddd6fe"/>
  <text x="366" y="448" font-size="12.5" font-weight="600" fill="#6d28d9">HTTP API + 存储</text>
  <text x="366" y="468" font-size="11.5" fill="#3b4a63">/api/config · /api/events · /api/stats</text>
  <text x="366" y="488" font-size="11.5" fill="#3b4a63">SQLite（server/data/）+ 快照</text>

  <!-- 推送渠道 -->
  <rect x="740" y="120" width="180" height="150" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="756" y="148" font-size="14" font-weight="600" fill="#0f172a">推送渠道</text>
  <text x="756" y="172" font-size="12" fill="#334155">钉钉（加签）</text>
  <text x="756" y="194" font-size="12" fill="#334155">企业微信</text>
  <text x="756" y="216" font-size="12" fill="#334155">Telegram Bot</text>
  <text x="756" y="248" font-size="11.5" fill="#0d9488">→ 推送到你的手机</text>

  <!-- 旁路 -->
  <rect x="740" y="300" width="180" height="180" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="756" y="328" font-size="13" font-weight="600" fill="#0f172a">旁路能力</text>
  <text x="756" y="352" font-size="11.5" fill="#334155">状态哨兵 watchdog</text>
  <text x="756" y="374" font-size="11.5" fill="#334155">自愈重启 restart</text>
  <text x="756" y="396" font-size="11.5" fill="#334155">系统硬重启（默认关）</text>
  <text x="756" y="418" font-size="11.5" fill="#334155">TG 远程控制</text>
  <text x="756" y="440" font-size="11.5" fill="#334155">静默查岗 duty-check</text>

  <!-- 箭头 -->
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <line x1="240" y1="156" x2="326" y2="176" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="248" y="150" font-size="11" fill="#64748b">拉流</text>

  <line x1="240" y1="366" x2="326" y2="366" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="326" y1="346" x2="240" y2="346" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="232" y="414" font-size="11" fill="#64748b">配置推送 / 事件拉取</text>

  <line x1="690" y1="195" x2="736" y2="195" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="696" y="188" font-size="11" fill="#64748b">事件</text>

  <text x="40" y="580" font-size="11" fill="#94a3b8">※ 本图为结构示意图，非真实系统截图；仅表达组件关系，不代表实际尺寸与配色。</text>
</svg>
